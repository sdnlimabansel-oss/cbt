      registerPWA() {

          const swCode = `
            self.addEventListener('install', e => self.skipWaiting());
            self.addEventListener('activate', e => self.clients.claim());
            self.addEventListener('fetch', e => {});
          `;
          const blob = new Blob([swCode], { type: 'application/javascript' });
          const swUrl = URL.createObjectURL(blob);
          navigator.serviceWorker.register(swUrl).catch(() => {});
        }
      }

      // ============================================================================
      // 4. UTILITAS KOMPRESI & KONVERSI GAMBAR OTOMATIS (CANVAS -> WEBP/JPEG BASE64)
      // ============================================================================
      async compressAndConvertImage(file, maxWidth = 650, quality = 0.78) {
        return new Promise((resolve, reject) => {
          if (!file || !file.type.startsWith('image/')) {
            return reject(new Error('File harus berupa gambar (JPG/PNG/WebP).'));
          }
          const reader = new FileReader();
          reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
              let width = img.width;
              let height = img.height;
              if (width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              }
              const canvas = document.createElement('canvas');
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.fillStyle = '#FFFFFF';
              ctx.fillRect(0, 0, width, height);
              ctx.drawImage(img, 0, 0, width, height);

              // Konversi otomatis ke WebP (atau fallback ke JPEG jika browser lama)
              let dataUrl = canvas.toDataURL('image/webp', quality);
              if (!dataUrl.startsWith('data:image/webp')) {
                dataUrl = canvas.toDataURL('image/jpeg', quality);
              }
              resolve(dataUrl);
            };
            img.onerror = () => reject(new Error('Gagal memuat gambar.'));
            img.src = event.target.result;
          };
          reader.onerror = () => reject(new Error('Gagal membaca file.'));
          reader.readAsDataURL(file);
        });
      }

      getAccessibleSiswa() {
        if (!this.user) return [];
        if (this.user.role === 'ADMIN' || this.user.role === 'GURU_MAPEL') {
          return this.db.siswa;
        }
        if (this.user.role === 'GURU_KELAS') {

          return this.db.siswa.filter(s => String(s.kelas).trim() === kls);
        }
        return [];
      }

      getAccessiblePaketUjian() {
        if (!this.user) return [];
        if (this.user.role === 'ADMIN') {
          return this.db.paket_ujian;
        }
        if (this.user.role === 'GURU_KELAS') {
          const kls = String(this.user.data.kelas_ampu || '').trim();
          return this.db.paket_ujian.filter(p => String(p.kelas).trim() === kls);
        }
        if (this.user.role === 'GURU_MAPEL') {
          const mapelAmpu = String(this.user.data.mapel_ampu || '').trim().toLowerCase();
          return this.db.paket_ujian.filter(p => String(p.mapel || '').toLowerCase().includes(mapelAmpu));

          return this.db.paket_ujian.filter(p => p.is_active && String(p.kelas).trim() === kls);
        }

      // IMPORT FILE EXCEL (.XLSX / .XLS) NATIVE
      async handleExcelSiswaImport(event) {
        const file = event.target.files?.[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (e) => {
          try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            const rows = XLSX.utils.sheet_to_json(worksheet, { defval: '' });

            if (!rows.length) {
              this.showToast('File Excel kosong atau format tidak sesuai!', 'error');
              return;
            }

            const forcedKelas = this.user?.role === 'GURU_KELAS' ? String(this.user.data.kelas_ampu) : null;
            const newSiswaList = rows.map((r, idx) => {
              const nomor = String(r.NOMOR_PESERTA || r['Nomor Peserta'] || r.nomor_peserta || `SD26-${Date.now().toString().slice(-4)}-${idx + 1}`).trim();
              const nisn = String(r.NISN || r.nisn || '').trim();
              const nama = String(r.NAMA_LENGKAP || r['Nama Lengkap'] || r.nama_lengkap || r.NAMA || '').trim();
              const kls = forcedKelas || String(r.KELAS || r.Kelas || r.kelas || '5').replace(/[^1-6]/g, '') || '5';
              const ruang = String(r.RUANG || r.Ruang || r.ruang || 'Ruang 01').trim();
              const pass = String(r.PASSWORD || r.Password || r.password || '123').trim();

              return {
                nomor_peserta: nomor,
                nisn,
                nama_lengkap: nama,
                kelas: kls,
                ruang,
                password: pass
              };
            }).filter(item => item.nama_lengkap !== '');

            if (!newSiswaList.length) {
              this.showToast('Tidak ada baris nama siswa yang valid di dalam file Excel!', 'error');
              return;
            }

            if (IS_PREVIEW) {
              newSiswaList.forEach((item, i) => {
                this.db.siswa.push({ id: `siswa-xls-${Date.now()}-${i}`, ...item });
              });
              this.saveLocalDB();
            } else {
              const { error } = await supabase.from('siswa').upsert(newSiswaList, { onConflict: 'nomor_peserta' });
              if (error) throw error;
              await this.loadAllData();
            }

            this.showToast(`Berhasil mengimpor ${newSiswaList.length} siswa dari file Excel!`, 'success');
            this.render();
          } catch (err) {
            this.showToast('Gagal membaca file Excel: ' + err.message, 'error');
          } finally {
            event.target.value = '';
          }
        };
        reader.readAsArrayBuffer(file);
      }

        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        let tokenBaru = '';
        for (let i = 0; i < 6; i++) tokenBaru += chars[Math.floor(Math.random() * chars.length)];
        try {
          if (IS_PREVIEW) {
            const p = this.db.paket_ujian.find(x => x.id === paketId);
            if (p) p.token = tokenBaru;
            this.saveLocalDB();

            if (error) throw error;

          }
          this.showToast(`Token baru berhasil digenerate: ${tokenBaru}`, 'success');
          this.render();
        } catch (err) {

      }

            this.soalFormDraft.gambar_soal = base64Webp;
            const previewEl = document.getElementById('preview-img-soal');

              previewEl.src = base64Webp;
              previewEl.parentElement.classList.remove('hidden');
            }
          } else if (targetType === 'PG') {
            this.soalFormDraft.pg_opsi[index].gambar = base64Webp;
            const previewEl = document.getElementById(`preview-img-pg-${index}`);
            if (previewEl) {
              previewEl.src = base64Webp;
              previewEl.parentElement.classList.remove('hidden');
            }
          } else if (targetType === 'JODOH') {
            if (side === 'kiri') {
              this.soalFormDraft.jodoh_pasangan[index].kiri_gambar = base64Webp;
            } else {
              this.soalFormDraft.jodoh_pasangan[index].kanan_gambar = base64Webp;
            }

            if (previewEl) {

              previewEl.parentElement.classList.remove('hidden');
            }
          }
          this.showToast('Gambar berhasil dikonversi & siap disimpan!', 'success');
        } catch (err) {
          this.showToast(err.message, 'error');
        }
      }

      async saveButirSoal(e) {
        e.preventDefault();
        const f = e.target;
        const tipe = this.soalFormDraft.tipe_soal;
        const paket_id = f.paket_id.value;
        const nomor_urut = parseInt(f.nomor_urut.value, 10) || 1;
        const pertanyaan = f.pertanyaan.value.trim();
        const bobot = parseFloat(f.bobot.value) || 10;

        let opsi_json = {};
        let kunci_jawaban = {};

        if (tipe === 'PG') {
          opsi_json = ['A', 'B', 'C', 'D'].map((kode, idx) => ({
            kode,
            teks: f[`pg_teks_${kode}`].value.trim(),
            gambar: this.soalFormDraft.pg_opsi[idx].gambar || ''
          }));
          kunci_jawaban = { jawaban: f.kunci_pg.value };
        } else if (tipe === 'BS') {
          opsi_json = {
            ket_benar: f.bs_ket_benar.value.trim() || 'Pernyataan Benar',
            ket_salah: f.bs_ket_salah.value.trim() || 'Pernyataan Salah'
          };
          kunci_jawaban = { jawaban: f.kunci_bs.value };
        } else if (tipe === 'JODOH') {
          this.syncJodohInputsFromDOM();
          const pasangan = this.soalFormDraft.jodoh_pasangan.map((p, idx) => ({
            id: 'P' + (idx + 1),
            kiri_teks: p.kiri_teks.trim(),
            kiri_gambar: p.kiri_gambar || '',
            kanan_teks: p.kanan_teks.trim(),
            kanan_gambar: p.kanan_gambar || ''
          }));
          const mapKunci = {};
          pasangan.forEach(p => {
            mapKunci[p.id] = p.kanan_teks || p.id;
          });
          opsi_json = { pasangan };
          kunci_jawaban = { pasangan: mapKunci };
        }

        const payload = {
          paket_id,
          nomor_urut,
          tipe_soal: tipe,
          pertanyaan,
          gambar_soal: this.soalFormDraft.gambar_soal || '',
          opsi_json,
          kunci_jawaban,
          bobot
        };

        try {
          if (IS_PREVIEW) {
            if (this.soalFormDraft.id) {
              const idx = this.db.butir_soal.findIndex(s => s.id === this.soalFormDraft.id);
              if (idx > -1) this.db.butir_soal[idx] = { ...this.db.butir_soal[idx], ...payload };
            } else {
              this.db.butir_soal.push({ id: 'soal-' + Date.now(), ...payload });
            }
            this.saveLocalDB();
          } else {
            if (this.soalFormDraft.id) {
              const { error } = await supabase.from('butir_soal').update(payload).eq('id', this.soalFormDraft.id);
              if (error) throw error;
            } else {
              const { error } = await supabase.from('butir_soal').insert([payload]);
              if (error) throw error;
            }
            await this.loadAllData();
          }
          this.closeModal();
          this.showToast('Butir Soal berhasil disimpan!', 'success');
          this.render();
        } catch (err) {
          this.showToast('Gagal menyimpan soal: ' + err.message, 'error');
        }
      }

      async mulaiUjianSiswa(e, paketId) {
        e.preventDefault();
        const inputToken = e.target.token_input.value.trim().toUpperCase();
        const paket = this.db.paket_ujian.find(p => p.id === paketId);
        if (!paket) return;

        if (inputToken !== paket.token.toUpperCase()) {
          this.showToast('Token Ujian tidak sesuai! Tanyakan Token yang benar kepada Bapak/Ibu Guru ya.', 'error');
          return;
        }

        const soalPaket = this.db.butir_soal
          .filter(s => s.paket_id === paketId)
          .sort((a, b) => a.nomor_urut - b.nomor_urut);

        if (!soalPaket.length) {
          this.showToast('Soal untuk paket ujian ini belum diinput oleh Guru.', 'info');
          return;
        }

        // Cek apakah sudah ada sesi
        let sesi = this.db.sesi_ujian.find(s => s.siswa_id === this.user.data.id && s.paket_id === paketId);
        if (sesi && sesi.status === 'SELESAI') {
          this.showToast('Kamu sudah menyelesaikan ujian ini!', 'info');
          return;
        }

        if (!sesi) {
          const newSesi = {
            siswa_id: this.user.data.id,
            paket_id: paketId,
            waktu_mulai: new Date().toISOString(),
            waktu_selesai: null,
            jawaban_siswa: {},
            nilai_akhir: 0,
            status: 'MENGERJAKAN'
          };
          if (IS_PREVIEW) {
            sesi = { id: 'sesi-' + Date.now(), ...newSesi };
            this.db.sesi_ujian.push(sesi);
            this.saveLocalDB();
          } else {
            const { data, error } = await supabase.from('sesi_ujian').insert([newSesi]).select().single();
            if (error) {
              this.showToast('Gagal memulai sesi: ' + error.message, 'error');
              return;
            }
            sesi = data;
            await this.loadAllData();
          }
        }

        // Siapkan urutan acak untuk kolom kanan soal Menjodohkan
        const shuffledRight = {};
        soalPaket.forEach(s => {
          if (s.tipe_soal === 'JODOH' && s.opsi_json?.pasangan) {
            const rightItems = s.opsi_json.pasangan.map(p => ({
              teks: p.kanan_teks,
              gambar: p.kanan_gambar
            }));
            shuffledRight[s.id] = rightItems.sort(() => Math.random() - 0.5);
          }
        });

        this.activeExam = {
          sesi,
          paket,
          soalList: soalPaket,
          currentIndex: 0,
          jawaban: sesi.jawaban_siswa || {},
          ragu: {},
          matchingSelectedLeft: null,
          shuffledRightOptions: shuffledRight,
          timerInterval: null,
          remainingSeconds: (paket.durasi_menit || 45) * 60
        };

        this.activeMenu = 'siswa_exam';
        this.startExamTimer();
        this.render();
      }

      startExamTimer() {
        this.clearExamTimer();
        this.activeExam.timerInterval = setInterval(() => {
          this.activeExam.remainingSeconds--;
          const timerEl = document.getElementById('cbt-countdown-timer');
          if (timerEl) {
            const m = String(Math.floor(this.activeExam.remainingSeconds / 60)).padStart(2, '0');
            const s = String(this.activeExam.remainingSeconds % 60).padStart(2, '0');
            timerEl.textContent = `${m}:${s}`;
          }
          if (this.activeExam.remainingSeconds <= 0) {
            this.clearExamTimer();
            this.showToast('Waktu ujian telah habis! Jawabanmu otomatis dikumpulkan.', 'info');
            this.submitUjianSiswa(true);
          }
        }, 1000);
      }

      clearExamTimer() {
        if (this.activeExam.timerInterval) {
          clearInterval(this.activeExam.timerInterval);
          this.activeExam.timerInterval = null;
        }
      }

      async pilihJawabanSiswa(soalId, nilai) {
        this.activeExam.jawaban[soalId] = nilai;

      async pilihKananJodoh(soalId, kananTeks) {
        const leftId = this.activeExam.matchingSelectedLeft;
        if (!leftId) {
          this.showToast('Klik dulu kotak pernyataan di sebelah KIRI, lalu klik pasangannya di KANAN ya! 👇', 'info');

      async syncProgresJawaban() {
        const sesiId = this.activeExam.sesi?.id;
        if (!sesiId) return;
        if (IS_PREVIEW) {
          const s = this.db.sesi_ujian.find(x => x.id === sesiId);
          if (s) s.jawaban_siswa = this.activeExam.jawaban;
          this.saveLocalDB();
        } else {
          await supabase
            .from('sesi_ujian')
            .update({ jawaban_siswa: this.activeExam.jawaban })
            .eq('id', sesiId);
        }
      }

      hitungSkorUjian(soalList, jawabanSiswa) {
        let totalBobotMaks = 0;
        let bobotDiperoleh = 0;

        soalList.forEach(soal => {
          const bobot = parseFloat(soal.bobot) || 10;
          totalBobotMaks += bobot;
          const jwb = jawabanSiswa[soal.id];
          if (!jwb) return;

          if (soal.tipe_soal === 'PG' || soal.tipe_soal === 'BS') {
            if (String(jwb).toUpperCase() === String(soal.kunci_jawaban?.jawaban).toUpperCase()) {
              bobotDiperoleh += bobot;
            }
          } else if (soal.tipe_soal === 'JODOH') {
            const kunciMap = soal.kunci_jawaban?.pasangan || {};
            const keys = Object.keys(kunciMap);
            if (keys.length > 0 && typeof jwb === 'object') {
              let benarCount = 0;
              keys.forEach(k => {
                if (jwb[k] && jwb[k] === kunciMap[k]) benarCount++;
              });
              bobotDiperoleh += (benarCount / keys.length) * bobot;
            }
          }
        });

        if (totalBobotMaks === 0) return 0;
        return Math.round((bobotDiperoleh / totalBobotMaks) * 100);
      }

      async submitUjianSiswa(autoSubmit = false) {
        if (!autoSubmit) {
          const belumDijawab = this.activeExam.soalList.filter(s => !this.activeExam.jawaban[s.id]).length;
          const msg = belumDijawab > 0
            ? `Masih ada ${belumDijawab} soal yang belum dijawab. Yakin ingin mengumpulkan ujian sekarang?`
            : 'Yakin sudah selesai dan ingin mengumpulkan semua jawabanmu?';
          if (!confirm(msg)) return;
        }

        this.clearExamTimer();
        const nilaiAkhir = this.hitungSkorUjian(this.activeExam.soalList, this.activeExam.jawaban);
        const waktuSelesai = new Date().toISOString();
        const sesiId = this.activeExam.sesi.id;

        try {
          if (IS_PREVIEW) {
            const idx = this.db.sesi_ujian.findIndex(s => s.id === sesiId);
            if (idx > -1) {
              this.db.sesi_ujian[idx] = {
                ...this.db.sesi_ujian[idx],
                jawaban_siswa: this.activeExam.jawaban,
                nilai_akhir: nilaiAkhir,
                waktu_selesai: waktuSelesai,
                status: 'SELESAI'
              };
            }
            this.saveLocalDB();
          } else {
            const { error } = await supabase
              .from('sesi_ujian')
              .update({
                jawaban_siswa: this.activeExam.jawaban,
                nilai_akhir: nilaiAkhir,
                waktu_selesai: waktuSelesai,
                status: 'SELESAI'
              })
              .eq('id', sesiId);
            if (error) throw error;
            await this.loadAllData();
          }

          this.activeExam.sesi.nilai_akhir = nilaiAkhir;
          this.activeExam.sesi.status = 'SELESAI';
          this.activeMenu = 'siswa_hasil';
          this.showToast('Alhamdulillah, jawaban ujianmu berhasil disimpan! 🎉', 'success');
          this.render();
        } catch (err) {
          this.showToast('Gagal menyimpan hasil ujian: ' + err.message, 'error');
        }
      }

      async resetSesiSiswa(sesiId) {
        if (!confirm('Reset sesi ujian siswa ini agar siswa dapat mengerjakan ulang?')) return;
        try {
          if (IS_PREVIEW) {
            this.db.sesi_ujian = this.db.sesi_ujian.filter(s => s.id !== sesiId);

        }
      }

      exportRekapNilaiExcel() {
        const accessibleSiswa = this.getAccessibleSiswa();
        const accessiblePaket = this.getAccessiblePaketUjian();
        const rows = [];

        this.db.sesi_ujian.forEach((sesi, idx) => {
          const s = accessibleSiswa.find(x => x.id === sesi.siswa_id);
          const p = accessiblePaket.find(x => x.id === sesi.paket_id);
          if (!s || !p) return;
          if (this.filterPaketMonitoring !== 'SEMUA' && p.id !== this.filterPaketMonitoring) return;

          rows.push({
            NO: idx + 1,
            NOMOR_PESERTA: s.nomor_peserta,
            NISN: s.nisn,
            NAMA_SISWA: s.nama_lengkap,
            KELAS: s.kelas,
            MATA_PELAJARAN: p.mapel,
            KODE_PAKET: p.kode_paket,
            STATUS: sesi.status,
            NILAI_AKHIR: sesi.nilai_akhir
          });
        });

        if (!rows.length) {
          this.showToast('Belum ada data nilai untuk diekspor!', 'info');
          return;
        }

        const ws = XLSX.utils.json_to_sheet(rows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Rekap_Nilai_CBT');
        XLSX.writeFile(wb, `Rekap_Nilai_CBT_SD_${new Date().toISOString().slice(0, 10)}.xlsx`);
        this.showToast('File Excel Rekap Nilai berhasil diunduh!', 'success');
      }

      // 13.4 GENERATOR KARTU UJIAN SIAP CETAK F4/FOLIO

        const sekolah = this.getSekolahSetting();

        if (this.user.role !== 'GURU_KELAS' && this.filterKelasKartu !== 'SEMUA') {
          siswaList = siswaList.filter(s => String(s.kelas) === String(this.filterKelasKartu));
        }

        return `
          <div class="space-y-5">
            <!-- Control Bar (Tidak ikut tercetak) -->
            <div class="clay-card p-5 flex flex-wrap items-center justify-between gap-4 no-print">
              <div class="flex flex-wrap items-center gap-3">
                <div>
                  <h3 class="font-display text-lg font-bold text-[#3D2E24]">Cetak Kartu Peserta Ujian (Format F4 / Folio)</h3>
                  <p class="text-xs text-[#78695E]">Otomatis menyusun kartu ujian lengkap dengan Kop Sekolah, Logo Donggala, Username/No. Peserta, dan Password.</p>
                </div>
              </div>

              <div class="flex items-center gap-3">
                ${this.user.role !== 'GURU_KELAS' ? `
                  <select onchange="window.app.filterKelasKartu=this.value; window.app.render();" class="clay-input px-4 py-2 text-xs font-extrabold">

                <div class="col-span-full clay-card p-10 text-center text-xs font-bold text-[#78695E]">Belum ada siswa pada kelas ini untuk dicetak kartunya.</div>

                      <div class="text-[9px] font-bold uppercase">${sekolah.kabupaten}</div>
                      <div class="text-[9px] font-bold uppercase">${sekolah.dinas || 'DINAS PENDIDIKAN, PEMUDA DAN OLAHRAGA'}</div>
                      <div class="text-xs font-black uppercase">${sekolah.nama_sekolah}</div>
                    </div>
                  </div>

                  <div class="text-center font-black text-[11px] uppercase tracking-wider bg-stone-100 py-1 rounded border border-stone-300 mb-2.5">
                    KARTU PESERTA UJIAN CBT • TA ${sekolah.tahun_ajaran}
                  </div>

                  <!-- Isi Data Siswa -->
                  <div class="grid grid-cols-12 gap-2 items-center">
                    <div class="col-span-9 space-y-1 text-[11px]">
                      <div class="flex"><span class="w-28 font-semibold">Nama Peserta</span><span class="font-bold">: ${s.nama_lengkap}</span></div>
                      <div class="flex"><span class="w-28 font-semibold">NISN</span><span>: ${s.nisn || '-'}</span></div>
                      <div class="flex"><span class="w-28 font-semibold">Kelas / Ruang</span><span class="font-bold">: Kelas ${s.kelas} / ${s.ruang}</span></div>
                      <div class="flex items-center pt-1">
                        <span class="w-28 font-bold text-stone-700">No. Peserta</span>
                        <span class="font-mono font-black text-xs bg-amber-100 px-2 py-0.5 rounded border border-amber-400">: ${s.nomor_peserta}</span>
                      </div>
                      <div class="flex items-center">
                        <span class="w-28 font-bold text-stone-700">Password</span>
                        <span class="font-mono font-black text-xs bg-emerald-100 px-2 py-0.5 rounded border border-emerald-400">: ${s.password}</span>
                      </div>

                      <div class="font-bold underline">${sekolah.kepala_sekolah}</div>

      // 13.5 BANK PAKET UJIAN & INPUT SOAL 3 TIPE + GAMBAR
      renderBankSoalSection() {
        const paketList = this.getAccessiblePaketUjian();
        if (!this.selectedPaketIdForSoal && paketList.length > 0) {
          this.selectedPaketIdForSoal = paketList[0].id;
        }
        const activePaket = paketList.find(p => p.id === this.selectedPaketIdForSoal);
        const soalList = activePaket
          ? this.db.butir_soal.filter(s => s.paket_id === activePaket.id).sort((a, b) => a.nomor_urut - b.nomor_urut)
          : [];

        return `
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <!-- Kolom Kiri: Daftar Paket Ujian -->
            <div class="lg:col-span-4 space-y-4">
              <div class="clay-card p-5">
                <div class="flex items-center justify-between mb-4">
                  <h3 class="font-display text-base font-bold text-[#3D2E24]">Daftar Paket Ujian</h3>
                  <button onclick="window.app.openPaketModal()" class="clay-btn-primary px-3.5 py-1.5 text-xs font-extrabold">
                    <i class="fa-solid fa-plus mr-1"></i> Paket Baru
                  </button>
                </div>

                <div class="space-y-2.5">
                  ${paketList.length === 0 ? `
                    <div class="p-6 text-center text-xs text-[#78695E]">Belum ada paket ujian.</div>
                  ` : paketList.map(p => {
                    const isSelected = p.id === activePaket?.id;
                    const jmlSoal = this.db.butir_soal.filter(s => s.paket_id === p.id).length;
                    return `
                      <div onclick="window.app.selectedPaketIdForSoal='${p.id}'; window.app.render();" class="
                        cursor-pointer p-4 rounded-2xl transition-all
                        ${isSelected ? 'clay-peach border-2 border-[#F28B66]' : 'bg-[#FBF6EE] hover:bg-white'}
                      ">
                        <div class="flex items-center justify-between mb-1">
                          <span class="px-2.5 py-0.5 rounded-full bg-white text-[10px] font-black text-[#3D2E24]">KELAS ${p.kelas}</span>
                          <span class="font-mono text-xs font-black text-[#F28B66]">TOKEN: ${p.token}</span>
                        </div>
                        <div class="font-display text-base font-bold text-[#3D2E24]">${p.mapel}</div>
                        <div class="text-[11px] font-bold text-[#78695E] mt-1 flex items-center justify-between">
                          <span>${jmlSoal} Soal • ${p.durasi_menit} Menit</span>
                          <div class="space-x-1" onclick="event.stopPropagation()">
                            <button onclick="window.app.openPaketModal('${p.id}')" class="w-7 h-7 rounded-full bg-white/80 text-stone-700 text-[11px]"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="window.app.deletePaketUjian('${p.id}')" class="w-7 h-7 rounded-full bg-white/80 text-red-600 text-[11px]"><i class="fa-solid fa-trash"></i></button>
                          </div>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>
            </div>

            <!-- Kolom Kanan: Butir Soal pada Paket Terpilih -->
            <div class="lg:col-span-8 space-y-4">
              ${!activePaket ? `
                <div class="clay-card p-12 text-center text-sm font-bold text-[#78695E]">
                  Pilih atau buat Paket Ujian di sebelah kiri terlebih dahulu untuk mulai menginput soal.
                </div>
              ` : `
                <div class="clay-card p-6 space-y-5">
                  <div class="flex flex-wrap items-center justify-between gap-3 border-b border-stone-200 pb-4">
                    <div>
                      <span class="text-[11px] font-extrabold text-[#F28B66] uppercase">${activePaket.kode_paket} • Kelas ${activePaket.kelas} SD</span>
                      <h3 class="font-display text-xl font-bold text-[#3D2E24]">${activePaket.mapel}</h3>
                    </div>

                    <div class="flex flex-wrap gap-2">
                      <button onclick="window.app.openSoalModal('${activePaket.id}', null, 'PG')" class="clay-btn-primary px-4 py-2 text-xs font-extrabold">
                        + Soal PG
                      </button>
                      <button onclick="window.app.openSoalModal('${activePaket.id}', null, 'BS')" class="clay-btn-teal px-4 py-2 text-xs font-extrabold">
                        + Benar/Salah
                      </button>
                      <button onclick="window.app.openSoalModal('${activePaket.id}', null, 'JODOH')" class="clay-btn-soft px-4 py-2 text-xs font-extrabold text-[#3D2E24]">
                        🧩 + Menjodohkan
                      </button>
                    </div>
                  </div>

                  <!-- Daftar Butir Soal -->
                  <div class="space-y-4">
                    ${soalList.length === 0 ? `
                      <div class="p-10 text-center text-xs font-bold text-[#78695E]">
                        Belum ada butir soal pada paket ini. Klik tombol <strong>+ Soal PG</strong>, <strong>+ Benar/Salah</strong>, atau <strong>+ Menjodohkan</strong> di atas.
                      </div>
                    ` : soalList.map(soal => {
                      const badgeColors = {
                        PG: 'bg-[#DCE5D5] text-emerald-950',
                        BS: 'bg-[#FDECC8] text-amber-950',
                        JODOH: 'bg-[#D7E3EB] text-sky-950'
                      };
                      const badgeNames = {
                        PG: 'Pilihan Ganda',
                        BS: 'Benar / Salah',
                        JODOH: 'Mencocokkan / Menjodohkan'
                      };
                      return `
                        <div class="p-5 rounded-3xl bg-[#FBF6EE] border border-stone-200/70 space-y-3">
                          <div class="flex items-center justify-between">
                            <div class="flex items-center gap-2">
                              <span class="w-8 h-8 rounded-2xl bg-[#3D2E24] text-white font-display font-bold text-xs flex items-center justify-center">
                                #${soal.nomor_urut}
                              </span>
                              <span class="px-3 py-1 rounded-full text-[11px] font-extrabold ${badgeColors[soal.tipe_soal]}">
                                ${badgeNames[soal.tipe_soal]}
                              </span>
                              <span class="text-xs font-bold text-[#78695E]">Bobot: ${soal.bobot} Poin</span>
                            </div>
                            <div class="space-x-1">
                              <button onclick="window.app.openSoalModal('${activePaket.id}', '${soal.id}')" class="clay-btn-soft px-3 py-1.5 text-xs font-bold"><i class="fa-solid fa-pen mr-1"></i> Edit</button>
                              <button onclick="window.app.deleteButirSoal('${soal.id}')" class="clay-btn-soft px-3 py-1.5 text-xs text-red-600"><i class="fa-solid fa-trash"></i></button>
                            </div>
                          </div>

                          <div class="text-sm font-bold text-[#3D2E24] leading-relaxed">${soal.pertanyaan}</div>
                          ${soal.gambar_soal ? `
                            <div><img src="${soal.gambar_soal}" class="max-h-40 rounded-2xl border bg-white p-1 object-contain" /></div>
                          ` : ''}

                          <!-- Ringkasan Opsi & Kunci -->
                          ${soal.tipe_soal === 'PG' && Array.isArray(soal.opsi_json) ? `
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-2 pt-1">
                              ${soal.opsi_json.map(op => `
                                <div class="p-2.5 rounded-2xl border text-xs flex items-center gap-2.5 ${soal.kunci_jawaban?.jawaban === op.kode ? 'bg-[#DCE5D5] border-emerald-500 font-extrabold' : 'bg-white/70 border-stone-200'}">
                                  <span class="w-6 h-6 rounded-full bg-white font-black flex items-center justify-center text-[11px] shadow-sm">${op.kode}</span>
                                  <div class="flex-1">
                                    <div>${op.teks}</div>
                                    ${op.gambar ? `<img src="${op.gambar}" class="h-14 mt-1 rounded-lg object-contain bg-white border p-0.5" />` : ''}
                                  </div>
                                  ${soal.kunci_jawaban?.jawaban === op.kode ? '<i class="fa-solid fa-circle-check text-emerald-700"></i>' : ''}
                                </div>
                              `).join('')}
                            </div>
                          ` : ''}

                          ${soal.tipe_soal === 'BS' ? `
                            <div class="text-xs font-extrabold text-emerald-800 bg-[#DCE5D5]/60 px-3.5 py-2 rounded-xl inline-block">
                              Kunci Jawaban: ${soal.kunci_jawaban?.jawaban}
                            </div>
                          ` : ''}

                          ${soal.tipe_soal === 'JODOH' && soal.opsi_json?.pasangan ? `
                            <div class="space-y-1.5 pt-1">
                              ${soal.opsi_json.pasangan.map(pas => `
                                <div class="flex items-center gap-3 text-xs bg-white/80 p-2.5 rounded-2xl border border-stone-200">
                                  <div class="flex-1 font-bold flex items-center gap-2">
                                    ${pas.kiri_gambar ? `<img src="${pas.kiri_gambar}" class="h-10 w-10 rounded-lg object-cover" />` : ''}
                                    <span>${pas.kiri_teks}</span>
                                  </div>
                                  <i class="fa-solid fa-arrow-right text-[#F28B66]"></i>
                                  <div class="flex-1 font-extrabold text-emerald-800 flex items-center gap-2">
                                    ${pas.kanan_gambar ? `<img src="${pas.kanan_gambar}" class="h-10 w-10 rounded-lg object-cover" />` : ''}
                                    <span>${pas.kanan_teks}</span>
                                  </div>
                                </div>
                              `).join('')}
                            </div>
                          ` : ''}
                        </div>
                      `;
                    }).join('')}
                  </div>
                </div>
              `}
            </div>
          </div>
        `;
      }

      // 13.6 MONITORING & REKAP NILAI
      renderMonitoringSection() {
        const accessibleSiswa = this.getAccessibleSiswa();
        const accessiblePaket = this.getAccessiblePaketUjian();

        const filteredSesi = this.db.sesi_ujian.filter(sesi => {
          const sMatch = accessibleSiswa.some(x => x.id === sesi.siswa_id);
          const pMatch = accessiblePaket.some(x => x.id === sesi.paket_id);
          const filterMatch = this.filterPaketMonitoring === 'SEMUA' || sesi.paket_id === this.filterPaketMonitoring;
          return sMatch && pMatch && filterMatch;
        });

        return `
          <div class="clay-card p-6 space-y-5">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <div>
                <h3 class="font-display text-lg font-bold text-[#3D2E24]">Monitoring Status & Rekap Nilai Ujian</h3>
                <p class="text-xs text-[#78695E]">Pantau siswa yang sedang mengerjakan, nilai akhir otomatis, atau reset sesi jika perangkat siswa terkendala.</p>
              </div>

              <div class="flex flex-wrap items-center gap-2">
                <select onchange="window.app.filterPaketMonitoring=this.value; window.app.render();" class="clay-input px-4 py-2 text-xs font-extrabold">
                  <option value="SEMUA">Semua Paket Ujian</option>
                  ${accessiblePaket.map(p => `<option value="${p.id}" ${this.filterPaketMonitoring === p.id ? 'selected' : ''}>Kelas ${p.kelas} - ${p.mapel}</option>`).join('')}
                </select>

                <button onclick="window.app.exportRekapNilaiExcel()" class="clay-btn-teal px-4 py-2.5 text-xs font-extrabold flex items-center gap-1.5">
                  <i class="fa-solid fa-file-excel"></i> Export Nilai ke Excel (.xlsx)
                </button>
              </div>
            </div>

            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="border-b border-stone-200 text-[11px] font-extrabold uppercase text-[#78695E]">
                    <th class="py-3 px-4">No. Peserta & Nama Siswa</th>
                    <th class="py-3 px-4">Kelas</th>
                    <th class="py-3 px-4">Mata Pelajaran</th>
                    <th class="py-3 px-4">Status</th>
                    <th class="py-3 px-4">Nilai Akhir</th>
                    <th class="py-3 px-4 text-right">Aksi</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-stone-200/60 text-xs font-bold">
                  ${filteredSesi.length === 0 ? `
                    <tr><td colspan="6" class="py-10 text-center text-[#78695E]">Belum ada aktivitas ujian siswa pada filter ini.</td></tr>
                  ` : filteredSesi.map(sesi => {
                    const s = accessibleSiswa.find(x => x.id === sesi.siswa_id);
                    const p = accessiblePaket.find(x => x.id === sesi.paket_id);
                    return `
                      <tr class="hover:bg-white/50">
                        <td class="py-3.5 px-4">
                          <div class="text-sm font-extrabold text-[#3D2E24]">${s?.nama_lengkap || '-'}</div>
                          <div class="font-mono text-[11px] text-[#78695E]">${s?.nomor_peserta || '-'}</div>
                        </td>
                        <td class="py-3.5 px-4">Kelas ${s?.kelas || '-'}</td>
                        <td class="py-3.5 px-4">${p?.mapel || '-'} <span class="text-[10px] text-[#78695E]">(${p?.kode_paket || ''})</span></td>
                        <td class="py-3.5 px-4">
                          ${sesi.status === 'SELESAI'
                            ? '<span class="px-3 py-1 rounded-full bg-[#DCE5D5] text-emerald-900 text-[11px] font-extrabold">✅ Selesai</span>'
                            : '<span class="px-3 py-1 rounded-full bg-[#FDECC8] text-amber-900 text-[11px] font-extrabold">⏳ Mengerjakan</span>'}
                        </td>
                        <td class="py-3.5 px-4">
                          <span class="font-display text-lg font-black text-[#F28B66]">${sesi.nilai_akhir ?? 0}</span>
                        </td>
                        <td class="py-3.5 px-4 text-right">
                          <button onclick="window.app.resetSesiSiswa('${sesi.id}')" class="clay-btn-soft px-3 py-1.5 text-[11px] text-red-600 font-extrabold">
                            <i class="fa-solid fa-rotate-left mr-1"></i> Reset Ujian
                          </button>
                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

                  <label class="block text-xs font-extrabold mb-1">NIP Kepala Sekolah</label>

              <div>
                <label class="block text-xs font-extrabold mb-1">URL Logo Kabupaten / Sekolah</label>

              <label class="flex items-center gap-2.5 cursor-pointer pt-2">

              <div class="pt-4">
                <button type="submit" class="clay-btn-primary px-6 py-3 text-xs font-extrabold">

                </button>

      // ============================================================================
      // 14. PORTAL SISWA SD (BERANDA PILIH PAKET, LEMBAR KERJA CBT 3D, & HASIL)
      // ============================================================================
      renderSiswaPortal() {
        if (this.activeMenu === 'siswa_exam') return this.renderSiswaExamSheet();
        if (this.activeMenu === 'siswa_hasil') return this.renderSiswaHasilView();

        const siswa = this.user.data;
        const paketList = this.getAccessiblePaketUjian();

        return `
          <div class="max-w-5xl mx-auto p-4 md:p-8 space-y-6">
            <!-- Header Sapaan Siswa -->
            <div class="clay-peach rounded-[30px] p-6 md:p-8 flex flex-wrap items-center justify-between gap-4">
              <div class="flex items-center gap-4">
                <div class="w-16 h-16 rounded-3xl bg-white/80 shadow flex items-center justify-center text-3xl">🎒</div>
                <div>
                  <span class="px-3 py-0.5 rounded-full bg-white/80 text-[11px] font-black text-[#F28B66]">
                    NOMOR PESERTA: ${siswa.nomor_peserta}
                  </span>
                  <h1 class="font-display text-2xl md:text-3xl font-bold text-[#3D2E24] mt-1">Halo, ${siswa.nama_lengkap}! 🌟</h1>
                  <p class="text-xs md:text-sm font-bold text-[#78695E]">Kelas ${siswa.kelas} SD • ${siswa.ruang}</p>
                </div>
              </div>
              <button onclick="window.app.logout()" class="clay-btn-soft px-5 py-2.5 text-xs font-extrabold text-red-600">
                <i class="fa-solid fa-right-from-bracket mr-1"></i> Keluar
              </button>
            </div>

            <!-- Daftar Jadwal Ujian Kelas Siswa -->
            <div class="space-y-4">
              <h2 class="font-display text-xl font-bold text-[#3D2E24]">Pilih Mata Pelajaran Ujianmu Hari Ini 📚</h2>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                ${paketList.length === 0 ? `
                  <div class="col-span-full clay-card p-10 text-center text-sm font-bold text-[#78695E]">
                    Belum ada jadwal ujian aktif untuk Kelas ${siswa.kelas} saat ini.
                  </div>
                ` : paketList.map(p => {
                  const sesi = this.db.sesi_ujian.find(s => s.siswa_id === siswa.id && s.paket_id === p.id);
                  const jmlSoal = this.db.butir_soal.filter(s => s.paket_id === p.id).length;
                  const sudahSelesai = sesi?.status === 'SELESAI';

                  return `
                    <div class="clay-card p-6 flex flex-col justify-between space-y-4">
                      <div>
                        <div class="flex items-center justify-between mb-2">
                          <span class="px-3 py-1 rounded-full bg-[#DCE5D5] text-emerald-950 text-xs font-extrabold">Kelas ${p.kelas} SD</span>
                          <span class="text-xs font-extrabold text-[#78695E]"><i class="fa-regular fa-clock mr-1"></i> ${p.durasi_menit} Menit • ${jmlSoal} Soal</span>
                        </div>
                        <h3 class="font-display text-xl font-bold text-[#3D2E24]">${p.mapel}</h3>
                        <p class="text-xs text-[#78695E] font-bold">Kode Paket: ${p.kode_paket}</p>
                      </div>

                      ${sudahSelesai ? `
                        <div class="p-3.5 rounded-2xl bg-[#DCE5D5] flex items-center justify-between">
                          <span class="text-xs font-extrabold text-emerald-950">✅ Kamu Sudah Selesai Mengerjakan</span>
                          ${this.getSekolahSetting().tampilkan_nilai ? `<span class="font-display text-lg font-black text-emerald-950">Nilai: ${sesi.nilai_akhir}</span>` : ''}
                        </div>
                      ` : `
                        <form onsubmit="window.app.mulaiUjianSiswa(event, '${p.id}')" class="flex gap-2">
                          <input name="token_input" required placeholder="Ketik Token (Contoh: ${IS_PREVIEW ? p.token : 'TOKEN'})" class="clay-input flex-1 px-4 py-2.5 text-xs font-black uppercase tracking-wider" />
                          <button type="submit" class="clay-btn-primary px-5 py-2.5 text-xs font-extrabold shrink-0">
                            Mulai Ujian <i class="fa-solid fa-play ml-1"></i>
                          </button>
                        </form>
                      `}
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          </div>
        `;
      }

      // LEMBAR KERJA CBT ANAK SD (3 TIPE SOAL + GAMBAR + TIMER)
      renderSiswaExamSheet() {
        const { paket, soalList, currentIndex, jawaban, ragu, remainingSeconds, matchingSelectedLeft, shuffledRightOptions } = this.activeExam;
        const soal = soalList[currentIndex];
        const m = String(Math.floor(remainingSeconds / 60)).padStart(2, '0');
        const s = String(remainingSeconds % 60).padStart(2, '0');
        const jwbSekarang = jawaban[soal.id];

        return `
          <div class="max-w-6xl mx-auto p-3 md:p-6 space-y-5">
            <!-- Top Exam Header -->
            <div class="clay-sidebar rounded-3xl p-4 md:px-6 flex flex-wrap items-center justify-between gap-4">
              <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-2xl bg-[#FAF3E8] flex items-center justify-center text-xl shadow">📝</div>
                <div>
                  <div class="font-display text-base md:text-lg font-bold text-[#3D2E24]">${paket.mapel} (Kelas ${paket.kelas})</div>
                  <div class="text-xs font-bold text-[#3D2E24]/80">Peserta: ${this.user.data.nama_lengkap}</div>
                </div>
              </div>

              <div class="flex items-center gap-3">
                <div class="px-4 py-2 rounded-full bg-[#FAF3E8] shadow flex items-center gap-2">
                  <i class="fa-solid fa-stopwatch text-[#F28B66] text-base"></i>
                  <span id="cbt-countdown-timer" class="font-mono text-base md:text-lg font-black text-[#3D2E24]">${m}:${s}</span>
                </div>
                <button onclick="window.app.submitUjianSiswa(false)" class="clay-btn-primary px-5 py-2.5 text-xs font-extrabold">
                  <i class="fa-solid fa-paper-plane mr-1"></i> Kumpulkan
                </button>
              </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
              <!-- Area Soal Utama -->
              <div class="lg:col-span-8 clay-card p-6 md:p-8 flex flex-col justify-between space-y-6">
                <div class="space-y-5">
                  <!-- Baris Nomor & Badge Tipe -->
                  <div class="flex items-center justify-between border-b border-stone-200 pb-3">
                    <div class="flex items-center gap-2.5">
                      <span class="px-4 py-1.5 rounded-full bg-[#3D2E24] text-white font-display text-sm font-bold">
                        Soal No. ${currentIndex + 1} dari ${soalList.length}
                      </span>
                      <span class="px-3 py-1 rounded-full bg-[#FAD7C8] text-[#3D2E24] text-xs font-extrabold">
                        ${soal.tipe_soal === 'PG' ? 'Pilihan Ganda' : (soal.tipe_soal === 'BS' ? 'Benar / Salah' : 'Pasangkan Jawaban')}
                      </span>
                    </div>
                  </div>

                  <!-- Teks Pertanyaan & Gambar Soal -->
                  <div class="text-base md:text-lg font-extrabold text-[#3D2E24] leading-relaxed">
                    ${soal.pertanyaan}
                  </div>
                  ${soal.gambar_soal ? `
                    <div class="p-2 bg-white rounded-3xl border shadow-sm inline-block">
                      <img src="${soal.gambar_soal}" class="max-h-60 rounded-2xl object-contain mx-auto" />
                    </div>
                  ` : ''}

                  <!-- OPSI JAWABAN TIPE 1: PILIHAN GANDA (PG) -->
                  ${soal.tipe_soal === 'PG' && Array.isArray(soal.opsi_json) ? `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5 pt-2">
                      ${soal.opsi_json.map((op, idx) => {
                        const dipilih = jwbSekarang === op.kode;
                        const pastelClasses = ['clay-mint', 'clay-peach', 'clay-butter', 'clay-sky'];
                        return `
                          <button type="button" onclick="window.app.pilihJawabanSiswa('${soal.id}', '${op.kode}')" class="
                            text-left p-4 rounded-3xl transition-all flex items-start gap-3.5
                            ${dipilih ? 'ring-4 ring-[#F28B66] bg-white shadow-lg scale-[1.01]' : pastelClasses[idx % 4] + ' hover:brightness-105'}
                          ">
                            <span class="w-9 h-9 rounded-2xl shrink-0 font-display font-bold text-sm flex items-center justify-center ${dipilih ? 'bg-[#F28B66] text-white' : 'bg-white/90 text-[#3D2E24]'} shadow">
                              ${op.kode}
                            </span>
                            <div class="flex-1">
                              <div class="text-sm md:text-base font-extrabold text-[#3D2E24]">${op.teks}</div>
                              ${op.gambar ? `<img src="${op.gambar}" class="max-h-32 mt-2 rounded-2xl bg-white p-1 border object-contain" />` : ''}
                            </div>
                          </button>
                        `;
                      }).join('')}
                    </div>
                  ` : ''}

                  <!-- OPSI JAWABAN TIPE 2: BENAR / SALAH -->
                  ${soal.tipe_soal === 'BS' ? `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-3">
                      <button type="button" onclick="window.app.pilihJawabanSiswa('${soal.id}', 'BENAR')" class="
                        p-6 rounded-3xl text-center transition-all space-y-2
                        ${jwbSekarang === 'BENAR' ? 'ring-4 ring-emerald-600 clay-mint scale-[1.02]' : 'bg-[#FBF6EE] hover:bg-[#DCE5D5]/50 border border-stone-200'}
                      ">
                        <div class="text-4xl">✅</div>
                        <div class="font-display text-xl font-bold text-[#3D2E24]">BENAR</div>
                        <div class="text-xs font-bold text-[#78695E]">${soal.opsi_json?.ket_benar || 'Pernyataan di atas Benar'}</div>
                      </button>

                      <button type="button" onclick="window.app.pilihJawabanSiswa('${soal.id}', 'SALAH')" class="
                        p-6 rounded-3xl text-center transition-all space-y-2
                        ${jwbSekarang === 'SALAH' ? 'ring-4 ring-[#F28B66] clay-peach scale-[1.02]' : 'bg-[#FBF6EE] hover:bg-[#FAD7C8]/50 border border-stone-200'}
                      ">
                        <div class="text-4xl">❌</div>
                        <div class="font-display text-xl font-bold text-[#3D2E24]">SALAH</div>
                        <div class="text-xs font-bold text-[#78695E]">${soal.opsi_json?.ket_salah || 'Pernyataan di atas Salah'}</div>
                      </button>
                    </div>
                  ` : ''}

                  <!-- OPSI JAWABAN TIPE 3: MENCOCOKKAN / MENJODOHKAN -->
                  ${soal.tipe_soal === 'JODOH' && soal.opsi_json?.pasangan ? `
                    <div class="space-y-3 pt-2">
                      <div class="flex items-center justify-between bg-[#FDECC8] px-4 py-2.5 rounded-2xl text-xs font-extrabold text-[#3D2E24]">
                        <span>💡 Cara Menjawab: Klik 1 kotak di KIRI, lalu klik pasangannya yang tepat di KANAN!</span>
                        <button type="button" onclick="window.app.resetPasanganJodoh('${soal.id}')" class="underline text-red-700">Ulangi Pasangan</button>
                      </div>

                      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- Kolom Kiri (Premis) -->
                        <div class="space-y-2.5">
                          <div class="text-xs font-black uppercase text-[#78695E]">1. Pilih Pernyataan Kiri</div>
                          ${soal.opsi_json.pasangan.map((p, idx) => {
                            const isSelected = matchingSelectedLeft === p.id;
                            const pairedValue = jwbSekarang?.[p.id];
                            return `
                              <button type="button" onclick="window.app.pilihKiriJodoh('${p.id}')" class="
                                w-full text-left p-3.5 rounded-2xl transition-all border-2
                                ${isSelected ? 'clay-peach border-[#F28B66] scale-[1.01]' : (pairedValue ? 'clay-mint border-emerald-500' : 'bg-[#FBF6EE] border-stone-200')}
                              ">
                                <div class="flex items-center gap-3">
                                  <span class="w-7 h-7 rounded-xl bg-white font-black text-xs flex items-center justify-center shadow-sm">${idx + 1}</span>
                                  ${p.kiri_gambar ? `<img src="${p.kiri_gambar}" class="w-12 h-12 rounded-xl object-cover bg-white border" />` : ''}
                                  <div class="flex-1 text-xs md:text-sm font-extrabold text-[#3D2E24]">${p.kiri_teks}</div>
                                </div>
                                ${pairedValue ? `
                                  <div class="mt-2 px-3 py-1 rounded-xl bg-white/90 text-[11px] font-black text-emerald-800 flex items-center gap-1.5">
                                    <i class="fa-solid fa-link"></i> Dipasangkan ke: ${pairedValue}
                                  </div>
                                ` : ''}
                              </button>
                            `;
                          }).join('')}
                        </div>

                        <!-- Kolom Kanan (Jawaban Teracak) -->
                        <div class="space-y-2.5">
                          <div class="text-xs font-black uppercase text-[#78695E]">2. Klik Pasangannya di Kanan</div>
                          ${(shuffledRightOptions[soal.id] || soal.opsi_json.pasangan.map(x => ({ teks: x.kanan_teks, gambar: x.kanan_gambar }))).map((item, idx) => {
                            const isUsed = jwbSekarang && Object.values(jwbSekarang).includes(item.teks);
                            return `
                              <button type="button" onclick="window.app.pilihKananJodoh('${soal.id}', '${item.teks.replace(/'/g, "\\'")}')" class="
                                w-full text-left p-3.5 rounded-2xl transition-all border-2 flex items-center gap-3
                                ${isUsed ? 'clay-sky border-sky-400' : 'bg-white hover:bg-[#FAF3E8] border-stone-200'}
                              ">
                                <span class="w-7 h-7 rounded-xl bg-[#FBF6EE] font-black text-xs flex items-center justify-center">${String.fromCharCode(65 + idx)}</span>
                                ${item.gambar ? `<img src="${item.gambar}" class="w-12 h-12 rounded-xl object-cover bg-white border" />` : ''}
                                <span class="text-xs md:text-sm font-extrabold text-[#3D2E24] flex-1">${item.teks}</span>
                              </button>
                            `;
                          }).join('')}
                        </div>
                      </div>
                    </div>
                  ` : ''}
                </div>

                <!-- Navigasi Bawah Soal (Sebelumnya, Ragu-ragu, Selanjutnya) -->
                <div class="pt-6 border-t border-stone-200 flex flex-wrap items-center justify-between gap-3">
                  <button type="button" ${currentIndex === 0 ? 'disabled' : ''} onclick="window.app.activeExam.currentIndex--; window.app.render();" class="clay-btn-soft px-5 py-3 text-xs font-extrabold ${currentIndex === 0 ? 'opacity-40 cursor-not-allowed' : ''}">
                    <i class="fa-solid fa-arrow-left mr-1.5"></i> Soal Sebelumnya
                  </button>

                  <button type="button" onclick="window.app.toggleRaguSoal('${soal.id}')" class="px-5 py-3 rounded-full text-xs font-extrabold transition ${ragu[soal.id] ? 'bg-amber-400 text-[#3D2E24] shadow-md' : 'clay-butter text-amber-950'}">
                    <i class="fa-solid fa-hand mr-1"></i> ${ragu[soal.id] ? 'Ditandai Ragu-ragu' : 'Ragu-ragu'}
                  </button>

                  ${currentIndex < soalList.length - 1 ? `
                    <button type="button" onclick="window.app.activeExam.currentIndex++; window.app.render();" class="clay-btn-teal px-6 py-3 text-xs font-extrabold">
                      Soal Selanjutnya <i class="fa-solid fa-arrow-right ml-1.5"></i>
                    </button>
                  ` : `
                    <button type="button" onclick="window.app.submitUjianSiswa(false)" class="clay-btn-primary px-6 py-3 text-xs font-extrabold">
                      Selesai & Kumpulkan <i class="fa-solid fa-check-double ml-1.5"></i>
                    </button>
                  `}
                </div>
              </div>

              <!-- Panel Nomor Soal Kanan -->
              <div class="lg:col-span-4 clay-card p-6 h-fit space-y-4">
                <h3 class="font-display text-base font-bold text-[#3D2E24]">Peta Nomor Soal</h3>
                <div class="grid grid-cols-5 gap-2.5">
                  ${soalList.map((item, idx) => {
                    const sudah = Boolean(jawaban[item.id]);
                    const isRagu = Boolean(ragu[item.id]);
                    const isCurrent = idx === currentIndex;
                    let btnStyle = 'bg-[#FBF6EE] text-[#3D2E24]';
                    if (sudah) btnStyle = 'clay-mint text-emerald-950';
                    if (isRagu) btnStyle = 'clay-butter text-amber-950';
                    if (isCurrent) btnStyle += ' ring-3 ring-[#F28B66] scale-105';

                    return `
                      <button type="button" onclick="window.app.activeExam.currentIndex=${idx}; window.app.render();" class="
                        h-11 rounded-2xl font-display font-bold text-sm transition-all flex items-center justify-center shadow-sm ${btnStyle}
                      ">
                        ${idx + 1}
                      </button>
                    `;
                  }).join('')}
                </div>

                <div class="pt-3 border-t border-stone-200 space-y-1.5 text-[11px] font-bold text-[#78695E]">
                  <div class="flex items-center gap-2"><span class="w-3.5 h-3.5 rounded bg-[#DCE5D5] inline-block"></span> Hijau: Sudah Dijawab</div>
                  <div class="flex items-center gap-2"><span class="w-3.5 h-3.5 rounded bg-[#FDECC8] inline-block"></span> Kuning: Ragu-ragu</div>
                  <div class="flex items-center gap-2"><span class="w-3.5 h-3.5 rounded bg-[#FBF6EE] border inline-block"></span> Krem: Belum Dijawab</div>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      renderSiswaHasilView() {
        const tampilkanNilai = this.getSekolahSetting().tampilkan_nilai;
        const skor = this.activeExam.sesi?.nilai_akhir ?? 0;

        return `
          <div class="min-h-screen flex items-center justify-center p-4">
            <div class="clay-card max-w-lg w-full p-8 text-center space-y-5">
              <div class="w-24 h-24 rounded-full clay-peach mx-auto flex items-center justify-center text-5xl shadow-md">
                🎉
              </div>
              <h2 class="font-display text-2xl md:text-3xl font-bold text-[#3D2E24]">Hebat! Kamu Sudah Selesai Ujian!</h2>
              <p class="text-xs md:text-sm font-semibold text-[#78695E]">
                Terima kasih <strong>${this.user.data.nama_lengkap}</strong>, seluruh jawabanmu pada mata pelajaran <strong>${this.activeExam.paket?.mapel}</strong> telah tersimpan dengan aman.
              </p>

              ${tampilkanNilai ? `
                <div class="clay-mint rounded-3xl p-6 space-y-1">
                  <div class="text-xs font-extrabold uppercase text-emerald-900">Nilai Akhir Kamu</div>
                  <div class="font-display text-5xl font-black text-[#3D2E24]">${skor}</div>
                </div>
              ` : ''}

              <div class="pt-2">
                <button onclick="window.app.activeMenu='siswa_home'; window.app.render();" class="clay-btn-primary px-8 py-3 text-xs font-extrabold">
                  <i class="fa-solid fa-house mr-1.5"></i> Kembali ke Beranda Siswa
                </button>
              </div>
            </div>
          </div>
        `;
      }
    }

    // Inisialisasi aplikasi ke objek window agar dapat diakses oleh event handler inline
    window.app = new CBTApp();
  </script>
</body>
</html>
